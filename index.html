<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apocalipse Brasil</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <style>
        body { font-family: 'Alegreya', serif; }
        .fade-in { animation: fadeIn 0.6s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .stat-bar { transition: width 0.4s ease; }
        .locked { opacity: 0.4; pointer-events: none; }
        .pulse-red { animation: pulseRed 1.5s ease-in-out infinite; }
        @keyframes pulseRed { 0%, 100% { color: #f87171; } 50% { color: #ef4444; } }
        .login-screen {
            background-image: url('https://images.pexels.com/photos/10045604/pexels-photo-10045604.jpeg?auto=compress&cs=tinysrgb&w=1280');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            background-color: rgba(0,0,0,0.7);
        }
        .hidden { display: none; }
    </style>
</head>
<body data-template-id="__page-root" class="min-h-screen flex flex-col items-center" style="background: rgb(26, 26, 46);">
    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="login-screen fixed inset-0 flex items-center justify-center z-50">
        <div class="bg-black bg-opacity-80 p-8 rounded-xl border border-gray-700 shadow-2xl max-w-md w-full mx-4">
            <h2 class="text-3xl font-bold text-amber-300 text-center mb-6 drop-shadow">Apocalipse Brasil</h2>
            <p class="text-gray-300 text-center mb-6 italic">Cada escolha tem consequências permanentes.</p>
            <div class="mb-4">
                <label for="player-name" class="block text-gray-400 mb-2">Nome do Sobrevivente:</label>
                <input type="text" id="player-name" class="w-full px-4 py-3 rounded-lg bg-gray-800 text-gray-200 border border-gray-600 focus:border-amber-400 focus:outline-none" placeholder="Digite seu nome..." maxlength="30">
            </div>
            <button id="btn-start" class="w-full py-3 rounded-lg bg-amber-500 hover:bg-amber-600 text-black font-bold text-lg transition-all mb-3">
                Iniciar Jornada
            </button>
            <button id="btn-continue" class="w-full py-3 rounded-lg bg-gray-700 hover:bg-gray-600 text-gray-200 font-bold text-lg transition-all hidden">
                Continuar
            </button>
            <p id="login-error" class="text-red-400 text-center mt-4 hidden">Digite um nome para começar.</p>
        </div>
    </div>

    <!-- HUD E CONTEÚDO DO JOGO -->
    <header class="w-full relative h-56 overflow-hidden">
        <img data-template-id="hero-image" class="canva-image w-full h-full object-cover" loading="lazy" src="https://images.pexels.com/photos/10045604/pexels-photo-10045604.jpeg?auto=compress&cs=tinysrgb&w=1280" alt="A deserted urban bridge with graffiti and overgrown vegetation under concrete pillars">
        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-black/80 flex items-end justify-center pb-5">
            <h1 data-template-id="book-title" class="canva-text font-bold text-center drop-shadow-lg" style="color: rgb(245, 230, 200); font-weight: 700; font-style: normal; font-size: 36px;">Apocalipse Brasil: Escolha Seu Destino</h1>
        </div>
    </header>
    <div data-template-id="hud-section" class="canva-section w-full max-w-2xl px-4 py-3" style="background: rgb(15, 15, 26);">
        <div class="flex flex-wrap gap-3 justify-between text-sm">
            <button type="button" class="text-amber-300 underline" onclick="saveGame()">Salvar</button>
            <button type="button" class="text-amber-300 underline" onclick="loadGame()">Carregar</button>
            <div class="flex items-center gap-1"><span class="text-red-400">❤️</span><span id="hud-health" class="text-gray-200 font-bold">100</span></div>
            <div class="flex items-center gap-1"><span>🧠</span><span id="hud-sanity" class="text-gray-200 font-bold">100</span></div>
            <div class="flex items-center gap-1"><span>🍖</span><span id="hud-food" class="text-gray-200 font-bold">3</span></div>
            <div class="flex items-center gap-1"><span>💧</span><span id="hud-water" class="text-gray-200 font-bold">3</span></div>
            <div class="flex items-center gap-1"><span>📅</span><span id="hud-day" class="text-gray-200 font-bold">Dia 0</span></div>
            <div id="hud-infected" class="hidden flex items-center gap-1"><span>🦠</span><span id="hud-infected-days" class="text-red-500 font-bold pulse-red">Infectado</span></div>
            <div class="flex items-center gap-1"><span>🎒</span><span id="hud-inventory" class="text-gray-300 text-xs max-w-[120px] truncate">Vazio</span></div>
            <div class="flex items-center gap-1"><span>👤</span><span id="hud-player-name" class="text-amber-300 font-bold"></span></div>
        </div>
    </div>
    <main class="w-full max-w-2xl px-4 py-6 flex-1">
        <div id="story-card" class="fade-in">
            <p data-template-id="subtitle" class="canva-text text-center mb-5 italic" style="color: rgb(168, 162, 158); font-weight: 400; font-style: italic; font-size: 17px;">Cada escolha tem consequências permanentes. Gerencie seus recursos. Sobreviva.</p>
            <div id="story-text" class="text-lg leading-relaxed mb-6 text-gray-200"></div>
            <div id="status-msg" class="text-sm mb-4 text-amber-300 italic hidden"></div>
            <div id="choices" class="space-y-3"></div>
        </div>
    </main>

    <template id="choice-btn-template">
        <button data-template-id="choice-btn" class="canva-button w-full text-left px-5 py-4 rounded-lg border border-gray-600 hover:border-amber-400 hover:bg-amber-400/10 transition-all duration-200 text-lg"></button>
    </template>
    <template id="restart-btn-template">
        <button data-template-id="restart-btn" class="canva-button mx-auto block px-6 py-3 rounded-lg font-bold mt-4"></button>
    </template>

    <script>
        let state = { 
            health: 100, 
            sanity: 100, 
            food: 3, 
            water: 3, 
            day: 0, 
            infected: false, 
            infectionDay: null, 
            inventory: [],
            playerName: ''
        };
        let currentScene = 'start';

        // Funções de login
        function showLogin() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.querySelector('header').classList.add('hidden');
            document.querySelector('[data-template-id="hud-section"]').classList.add('hidden');
            document.querySelector('main').classList.add('hidden');
        }

        function hideLogin() {
            document.getElementById('login-screen').classList.add('hidden');
            document.querySelector('header').classList.remove('hidden');
            document.querySelector('[data-template-id="hud-section"]').classList.remove('hidden');
            document.querySelector('main').classList.remove('hidden');
        }

        function initLoginButtons() {
            const saveExists = localStorage.getItem('apocalipseBrasilSave') !== null;
            const btnContinue = document.getElementById('btn-continue');
            if (saveExists) {
                btnContinue.classList.remove('hidden');
            } else {
                btnContinue.classList.add('hidden');
            }

            document.getElementById('btn-start').addEventListener('click', () => {
                const nameInput = document.getElementById('player-name').value.trim();
                if (!nameInput) {
                    document.getElementById('login-error').classList.remove('hidden');
                    return;
                }
                document.getElementById('login-error').classList.add('hidden');
                state.playerName = nameInput;
                resetGame();
                hideLogin();
            });

            document.getElementById('btn-continue').addEventListener('click', () => {
                const success = loadGame();
                if (success) {
                    hideLogin();
                } else {
                    alert('Nenhum save encontrado.');
                }
            });
        }

        // Funções de jogo (adaptadas)
        function rollD20() {
            return Math.floor(Math.random() * 20) + 1;
        }

        function saveGame() {
            localStorage.setItem('apocalipseBrasilSave', JSON.stringify({ state, currentScene }));
            showStatusMsg('💾 Jogo salvo!');
        }

        function loadGame() {
            const data = localStorage.getItem('apocalipseBrasilSave');
            if (data) {
                const parsed = JSON.parse(data);
                state = parsed.state;
             currentScene = parsed.currentScene || 'start';
if (!story[currentScene]) {
    currentScene = 'start';
}
renderScene(currentScene);
renderScene(currentScene);
                showStatusMsg('📂 Jogo carregado!');
                return true;
            }
            return false;
        }

        function showStatusMsg(msg) {
            const el = document.getElementById('status-msg');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function updateHUD() {
            document.getElementById('hud-health').textContent = state.health;
            document.getElementById('hud-sanity').textContent = state.sanity;
            document.getElementById('hud-food').textContent = state.food;
            document.getElementById('hud-water').textContent = state.water;

            let dayDisplay = 'Dia ' + state.day;
            if (state.infected && state.infectionDay !== null) {
                const daysLeft = 3 - (state.day - state.infectionDay);
                dayDisplay += ' (🦠 ' + Math.max(0, daysLeft) + 'd)';
            }
            document.getElementById('hud-day').textContent = dayDisplay;

            const infectedEl = document.getElementById('hud-infected');
            if (state.infected && state.infectionDay !== null) {
                infectedEl.classList.remove('hidden');
                const daysLeft = Math.max(0, 3 - (state.day - state.infectionDay));
                document.getElementById('hud-infected-days').textContent = 'Infectado - ' + daysLeft + ' dias restantes';
            } else {
                infectedEl.classList.add('hidden');
            }

            const invEl = document.getElementById('hud-inventory');
            if (state.inventory.length === 0) {
                invEl.textContent = 'Vazio';
                invEl.classList.add('text-gray-500');
            } else {
                invEl.textContent = state.inventory.join(', ');
                invEl.classList.remove('text-gray-500');
            }

            document.getElementById('hud-player-name').textContent = state.playerName || 'Desconhecido';
        }

        function applyEffects(effects) {
            if (!effects) return;
            const msgs = [];
            if (effects.health) { state.health = Math.max(0, Math.min(100, state.health + effects.health)); msgs.push((effects.health > 0 ? '+' : '') + effects.health + ' Saúde'); }
            if (effects.sanity) { state.sanity = Math.max(0, Math.min(100, state.sanity + effects.sanity)); msgs.push((effects.sanity > 0 ? '+' : '') + effects.sanity + ' Sanidade'); }
            if (effects.food) { state.food = Math.max(0, state.food + effects.food); msgs.push((effects.food > 0 ? '+' : '') + effects.food + ' Comida'); }
            if (effects.water) { state.water = Math.max(0, state.water + effects.water); msgs.push((effects.water > 0 ? '+' : '') + effects.water + ' Água'); }

            let dayChanged = false;
            if (effects.day) { state.day += effects.day; dayChanged = true; }

            if (effects.infect) { state.infected = true; state.infectionDay = state.day; msgs.push('🦠 Infecção adquirida!'); }
            if (effects.infect === false) { state.infected = false; state.infectionDay = null; msgs.push('💉 Infecção removida'); }
            if (effects.item && !state.inventory.includes(effects.item)) { state.inventory.push(effects.item); msgs.push('🎒 Item: ' + effects.item); }

            updateHUD();

            if (dayChanged && effects.day > 0) {
                const eventMsg = randomEvent();
                if (eventMsg) msgs.push(eventMsg);
            }

            const el = document.getElementById('status-msg');
            if (msgs.length) { el.textContent = msgs.join(' | '); el.classList.remove('hidden'); }
            else { el.classList.add('hidden'); }
        }

        function randomEvent() {
            const roll = rollD20();
            if (roll === 1) {
                const bonusFood = Math.floor(Math.random() * 2) + 1;
                const bonusWater = Math.floor(Math.random() * 2) + 1;
                state.food = Math.min(10, state.food + bonusFood);
                state.water = Math.min(10, state.water + bonusWater);
                updateHUD();
                return '🍀 Sorte! Você encontrou suprimentos abandonados (+' + bonusFood + '🍖 +' + bonusWater + '💧)';
            } else if (roll === 20) {
                state.health = Math.max(0, state.health - 10);
                state.sanity = Math.max(0, state.sanity - 5);
                updateHUD();
                return '⚡ Tempestade violenta te pegou desprevenido! (-10 ❤️ -5 🧠)';
            } else if (roll === 2) {
                state.sanity = Math.min(100, state.sanity + 5);
                updateHUD();
                return '🌅 O nascer do sol traz uma estranha sensação de esperança (+5 🧠)';
            } else if (roll === 19) {
                state.sanity = Math.max(0, state.sanity - 5);
                updateHUD();
                return '👁️ Você tem a constante sensação de estar sendo observado (-5 🧠)';
            }
            return null;
        }

        function checkDeath() {
            if (state.infected && state.infectionDay !== null && state.day - state.infectionDay >= 3) {
                return "🦠 A febre consumiu você. Seu corpo parou de lutar. E então... você abriu os olhos. Você se tornou um deles.";
            }
            if (state.health <= 0) return "☠️ Seu corpo não aguentou. A infecção, a fome ou os ferimentos cobraram seu preço. O apocalipse não perdoa fraqueza.";
            if (state.sanity <= 0) return "🕳️ Sua mente se despedaçou. Você vaga sem rumo, murmurando nomes que não lembra mais. Para o mundo, você já morreu.";
            return null;
        }

        function renderScene(sceneId) {
            currentScene = sceneId;
            const scene = story[sceneId];
            if (!scene) {
                console.error('Cena não encontrada:', sceneId);
                return;
            }
            const card = document.getElementById('story-card');
            card.classList.remove('fade-in');
            void card.offsetWidth;
            card.classList.add('fade-in');

            if (scene.effects) applyEffects(scene.effects);

            const deathMsg = checkDeath();
            if (deathMsg) {
                document.getElementById('story-text').textContent = deathMsg;
                document.getElementById('status-msg').classList.add('hidden');
                const choicesEl = document.getElementById('choices');
                choicesEl.innerHTML = '';
                const tpl = document.getElementById('restart-btn-template');
                const btn = tpl.content.cloneNode(true);
                const button = btn.querySelector('button');
                button.textContent = '☠️ Recomeçar';
                button.addEventListener('click', resetGame);
                choicesEl.appendChild(btn);
                return;
            }

            document.getElementById('story-text').textContent = scene.text;
            const choicesEl = document.getElementById('choices');
            choicesEl.innerHTML = '';

            if (!scene.choices || scene.choices.length === 0) {
                const tpl = document.getElementById('restart-btn-template');
                const btn = tpl.content.cloneNode(true);
                const button = btn.querySelector('button');
                button.textContent = '↺ Recomeçar';
                button.addEventListener('click', resetGame);
                choicesEl.appendChild(btn);
            } else {
                scene.choices.forEach(choice => {
                    const tpl = document.getElementById('choice-btn-template');
                    const btn = tpl.content.cloneNode(true);
                    const button = btn.querySelector('button');
                    let label = '→ ' + choice.text;
                    const hints = [];
                    if (choice.effects) {
                        if (choice.effects.food && choice.effects.food < 0) hints.push(choice.effects.food + '🍖');
                        if (choice.effects.water && choice.effects.water < 0) hints.push(choice.effects.water + '💧');
                        if (choice.effects.health && choice.effects.health < 0) hints.push(choice.effects.health + '❤️');
                        if (choice.effects.sanity && choice.effects.sanity < 0) hints.push(choice.effects.sanity + '🧠');
                    }
                    if (choice.roll) {
                        hints.push('🎲 Risco (DC ' + choice.roll.dc + ')');
                    }
                    if (hints.length) label += '  [' + hints.join(' ') + ']';
                    button.textContent = label;

                    if (choice.requires) {
                        const locked = Object.entries(choice.requires).some(([k, v]) => k === 'hasItem' ? !state.inventory.includes(v) : state[k] < v);
                        if (locked) {
                            button.classList.add('locked');
                            button.title = 'Recursos insuficientes';
                        }
                    }

                    if (!button.classList.contains('locked')) {
                        button.addEventListener('click', () => {
                            if (choice.roll) {
                                const d20 = rollD20();
                                if (d20 >= choice.roll.dc) {
                                    if (choice.roll.success) renderScene(choice.roll.success);
                                    else if (choice.next) renderScene(choice.next);
                                } else {
                                    if (choice.roll.failure) renderScene(choice.roll.failure);
                                    else if (choice.next) renderScene(choice.next);
                                }
                            } else {
                                if (choice.effects) applyEffects(choice.effects);
                                renderScene(choice.next);
                            }
                        });
                    }
                    choicesEl.appendChild(btn);
                });
            }
        }

        function resetGame() {
            state = { 
                health: 100, 
                sanity: 100, 
                food: 3, 
                water: 3, 
                day: 0, 
                infected: false, 
                infectionDay: null, 
                inventory: [],
                playerName: state.playerName || '' // preserva o nome ao reiniciar
            };
            currentScene = 'start';
            updateHUD();
            renderScene('start');
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            showLogin();
            initLoginButtons();
            updateHUD();
            lucide.createIcons();
        });
    </script>
